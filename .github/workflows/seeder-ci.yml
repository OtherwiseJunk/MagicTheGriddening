name: Seeder CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths:
      - "apps/seeder/**"
      - "packages/**"
      - ".github/workflows/seeder-ci.yml"
      - "docker-compose*.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/seeder/**"
      - "packages/**"
      - ".github/workflows/seeder-ci.yml"
      - "docker-compose*.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/otherwisejunk/grid-the-seedening

jobs:
  checks:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      pull-requests: write

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: griddening
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/griddening?schema=public

    defaults:
      run:
        working-directory: apps/seeder

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Deps
        working-directory: ${{ github.workspace }}
        run: npm install --workspace=apps/seeder
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Format Check
        run: npm run format:check
      - name: Test
        run: npx vitest run --coverage.enabled true
      - name: Report Coverage
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: davelosert/vitest-coverage-report-action@02f3c2e641286b7fa308cd3e430783103ce6103b # v2
        with:
          vite-config-path: apps/seeder/vitest.config.ts
          json-summary-path: apps/seeder/coverage/coverage-summary.json
          json-final-path: apps/seeder/coverage/coverage-final.json
      - name: Setup Database
        run: npx prisma db push
      - name: Integration Test - Generate Puzzles
        run: npx tsx main.ts
        env:
          RUN_ONCE: true
          MINIMUM_HITS: 1
          PUZZLE_BUFFER: 1
        timeout-minutes: 8
      - name: Verify Puzzles Created
        run: |
          COUNT=$(psql "${DATABASE_URL%%\?*}" -t -c "SELECT COUNT(*) FROM \"Game\";" | tr -d ' ')
          echo "Games created: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "No games were created!"
            exit 1
          fi
      - name: Build Docker Image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4 # v6
        with:
          context: .
          file: apps/seeder/dockerfile
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          load: true
      - name: Reset Database
        run: psql "${DATABASE_URL%%\?*}" -c "DELETE FROM \"Game\";"
      - name: Docker Integration Test
        run: |
          docker run --rm \
            --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e RUN_ONCE=true \
            -e MINIMUM_HITS=1 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
        timeout-minutes: 5
      - name: Verify Docker Puzzles Created
        run: |
          COUNT=$(psql "${DATABASE_URL%%\?*}" -t -c "SELECT COUNT(*) FROM \"Game\";" | tr -d ' ')
          echo "Games created by Docker container: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "No games were created!"
            exit 1
          fi
      - name: Reset Database Before Scheduler Test
        run: psql "${DATABASE_URL%%\?*}" -c "DELETE FROM \"Game\";"
      - name: Docker Scheduler Test
        run: |
          docker run -d --name scheduler-test \
            --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e MINIMUM_HITS=1 \
            -e CRON_SCHEDULE="*/15 * * * * *" \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          sleep 50
          docker logs scheduler-test
          FIRINGS=$(docker logs scheduler-test 2>&1 | grep -c "firing job" || true)
          docker stop scheduler-test >/dev/null
          docker rm scheduler-test >/dev/null
          echo "Scheduler fired $FIRINGS time(s)"
          if [ "$FIRINGS" -lt 2 ]; then
            echo "Expected scheduler to fire at least 2 times"
            exit 1
          fi
        timeout-minutes: 3
      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker image
        if: github.event_name != 'pull_request'
        working-directory: ${{ github.workspace }}
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest
