name: Bsky Bot CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths:
      - "apps/bsky-bot/**"
      - "packages/**"
      - ".github/workflows/bsky-bot-ci.yml"
      - "docker-compose*.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/bsky-bot/**"
      - "packages/**"
      - ".github/workflows/bsky-bot-ci.yml"
      - "docker-compose*.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/otherwisejunk/griddening-bsky-bot

defaults:
  run:
    working-directory: apps/bsky-bot

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --workspace=apps/bsky-bot
        working-directory: .
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run fmt:check
      - name: Test
        run: npm test
      - name: Build Docker image
        run: docker build -t bsky-bot-test -f apps/bsky-bot/Dockerfile .
        working-directory: .
      - name: Docker startup smoke test
        run: |
          docker run -d --name bsky-smoke \
            -e BLUESKY_USERNAME=test \
            -e BLUESKY_PASSWORD=test \
            bsky-bot-test
          sleep 5
          EXIT_CODE=$(docker inspect bsky-smoke --format='{{.State.ExitCode}}')
          docker rm -f bsky-smoke
          if [ "$EXIT_CODE" = "127" ]; then
            echo "Container exited with code 127 (command not found - likely missing runtime dependency)"
            exit 1
          fi
        working-directory: .

  publish:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: apps/bsky-bot/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
